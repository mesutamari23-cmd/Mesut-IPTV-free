<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesut IPTV</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--bg:#141414;--card:#222;--red:#e50914;--tx:#fff;--mut:#b3b3b3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
.hide{display:none!important}
header{position:fixed;top:0;inset-inline:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 4%;background:linear-gradient(#000c,transparent)}
header.solid{background:#141414}
.logo{color:var(--red);font-weight:900;font-size:26px;letter-spacing:1px}
nav{display:flex;gap:14px;flex:1;overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);font-size:15px;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;font-weight:700}
#q{background:#000a;border:1px solid #555;color:#fff;padding:7px 12px;border-radius:4px;width:150px}
.ic{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 20%,#3a0508,#000 70%)}
.box{background:#000c;padding:34px;border-radius:8px;width:100%;max-width:440px}
.box h1{color:var(--red);font-size:34px;margin-bottom:6px}
.box p{color:var(--mut);margin-bottom:18px;font-size:14px}
.box input,.box textarea{width:100%;background:#333;border:0;color:#fff;padding:13px;border-radius:4px;margin-bottom:12px;font:inherit;direction:ltr;text-align:left}
.btn{width:100%;background:var(--red);color:#fff;border:0;padding:13px;border-radius:4px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn.sec{background:#333}
#err{color:#ff7b7b;font-size:13px;min-height:18px}
#hero{height:62vh;min-height:360px;display:flex;align-items:flex-end;padding:0 4% 60px;background:linear-gradient(0deg,#141414,#0000 60%),linear-gradient(135deg,#5a0b10,#111);background-size:cover;background-position:center}
#hero h2{font-size:clamp(26px,5vw,52px);max-width:600px;margin-bottom:12px}
#hero .b{display:flex;gap:10px}
#hero .b button{padding:10px 26px;border:0;border-radius:4px;font-size:16px;font-weight:700;cursor:pointer}
.row{padding:0 4%;margin-bottom:26px}
.row h3{margin-bottom:10px;font-size:19px}
.sc{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.c{flex:0 0 auto;width:160px;aspect-ratio:2/3;background:var(--card);border-radius:4px;overflow:hidden;position:relative;cursor:pointer;transition:transform .2s}
.c:hover,.c:focus{transform:scale(1.07);z-index:2}.c:focus,.btn:focus,nav button:focus,.ic:focus,#hero button:focus,.e:focus{outline:3px solid #fff;outline-offset:2px}input:focus{outline:2px solid #fff}
.c img{width:100%;height:100%;object-fit:contain;padding:14px;background:#1b1b1b}
.c span{position:absolute;bottom:0;inset-inline:0;padding:22px 8px 8px;background:linear-gradient(transparent,#000);font-size:13px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:90px 4% 30px}
.grid .c{width:auto}
#pl{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#pl video{flex:1;width:100%;min-height:0;background:#000}
#pb{position:absolute;top:0;inset-inline:0;padding:14px 4%;display:flex;gap:14px;align-items:center;background:linear-gradient(#000c,transparent)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#ff9b9b;text-align:center;padding:20px}
#ep{position:fixed;inset:0;background:#000e;z-index:40;overflow:auto;padding:70px 4% 30px}#ep h2{margin-bottom:14px}#ep .e{background:#222;padding:12px;border-radius:4px;margin-bottom:6px;cursor:pointer}#ep .e:hover{background:#333}.sep{color:var(--mut);text-align:center;margin:6px 0 12px;font-size:13px}
@media(max-width:600px){#q{width:100px}.c{width:120px}}
</style>
</head>
<body>

<section id="login">
 <div class="box">
  <h1>Mesut</h1>
  <p>سجّل الدخول بحساب Xtream</p>
  <input id="xs" placeholder="السيرفر  http://example.com:8080">
  <input id="xu" placeholder="اسم المستخدم" autocomplete="username">
  <input id="xp" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button class="btn" id="goX">دخول (Xtream)</button>
  <div id="err"></div>
 </div>
</section>

<main id="app" class="hide">
 <header id="hd">
  <div class="logo">MESUT</div>
  <nav id="nav"></nav>
  <input id="q" type="search" placeholder="بحث…">
  <button class="ic" id="out" title="تغيير القائمة">⟲</button>
 </header>
 <div id="home">
  <div id="hero"><div><h2 id="ht"></h2><div class="b"><button style="background:#fff;color:#000" id="hp">▶ تشغيل</button></div></div></div>
  <div id="rows"></div>
 </div>
 <div id="res" class="grid hide"></div>
</main>

<section id="ep" class="hide"><button class="ic" id="epc" style="position:absolute;top:16px;inset-inline-start:4%">✕</button><h2 id="eh"></h2><div id="el"></div></section>

<section id="pl" class="hide">
 <div id="pb"><button class="ic" id="cl">✕</button><b id="pt"></b></div>
 <video id="v" controls autoplay playsinline></video>
 <div id="msg"></div>
</section>

<script>
const $=i=>document.getElementById(i);
let items=[],hls=null,cat="all";

function enter(){
 $("login").classList.add("hide");$("app").classList.remove("hide");
 build();
}
function card(it){
 const d=document.createElement("div");d.className="c";
 d.innerHTML=(it.logo?'<img loading="lazy" referrerpolicy="no-referrer" alt="">':'')+'<span></span>';
 if(it.logo){const im=d.querySelector("img");im.src=it.logo;im.onerror=()=>im.remove()}
 d.querySelector("span").textContent=it.name;
 d.tabIndex=0;d.onclick=()=>play(it);d.onkeydown=e=>{if(e.key==="Enter")play(it)};return d;
}
function build(){
 const tabs=[["all","الكل"],["live","مباشر"],["movies","أفلام"],["series","مسلسلات"]];
 $("nav").innerHTML="";
 tabs.forEach(([k,n])=>{const b=document.createElement("button");b.textContent=n;b.className=k===cat?"on":"";b.onclick=()=>{cat=k;build()};$("nav").appendChild(b)});
 const list=items.filter(i=>cat==="all"||i.k===cat);
 $("res").classList.add("hide");$("home").classList.remove("hide");$("q").value="";
 const pick=list[Math.floor(Math.random()*list.length)]||items[0];
 $("ht").textContent=pick.name;$("hp").onclick=()=>play(pick);
 if(pick.logo)$("hero").style.backgroundImage=`linear-gradient(0deg,#141414,#0000 60%),url("${pick.logo.replace(/"/g,"")}")`;
 const groups={};list.forEach(i=>(groups[i.group]=groups[i.group]||[]).push(i));
 $("rows").innerHTML="";
 Object.entries(groups).forEach(([g,arr])=>{
  const r=document.createElement("div");r.className="row";
  const h=document.createElement("h3");h.textContent=g;
  const s=document.createElement("div");s.className="sc";
  arr.slice(0,60).forEach(i=>s.appendChild(card(i)));
  r.append(h,s);$("rows").appendChild(r);
 });
}
$("q").oninput=e=>{
 const v=e.target.value.trim().toLowerCase();
 if(!v){build();return}
 $("home").classList.add("hide");$("res").classList.remove("hide");$("res").innerHTML="";
 items.filter(i=>i.name.toLowerCase().includes(v)).slice(0,200).forEach(i=>$("res").appendChild(card(i)));
};
function play(it){
 if(it.sid)return episodes(it);
 const v=$("v");$("pl").classList.remove("hide");$("pt").textContent=it.name;$("msg").textContent="";
 if(hls){hls.destroy();hls=null}
 const u=it.url;
 if(/\.m3u8(\?|$)/i.test(u)||/\/live\//.test(u)){
  if(window.Hls&&Hls.isSupported()){
   hls=new Hls();hls.loadSource(u);hls.attachMedia(v);
   hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$("msg").textContent="تعذّر تشغيل هذه القناة"});
  }else v.src=u;
 }else v.src=u;
 v.play().catch(()=>{});
}
$("v").onerror=()=>{$("msg").textContent="تعذّر تشغيل هذا البث"};
$("cl").onclick=()=>{$("v").pause();$("v").removeAttribute("src");if(hls){hls.destroy();hls=null}$("pl").classList.add("hide")};
$("out").onclick=()=>{try{localStorage.removeItem(KX)}catch(e){}XT=null;items=[];$("app").classList.add("hide");$("login").classList.remove("hide")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"||e.key==="Backspace"&&!/INPUT/.test(document.activeElement.tagName)){if(!$("pl").classList.contains("hide"))$("cl").click();else if(!$("ep").classList.contains("hide"))$("epc").click()}});
window.onscroll=()=>$("hd").classList.toggle("solid",scrollY>40);


const KX="mesut_xt";let XT=null;
async function xtLogin(c,save){
 const s=c.s.replace(/\/+$/,""),u=c.u,p=c.p;
 const base=`${s}/player_api.php?username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`;
 const J=a=>fetch(base+(a?"&action="+a:"")).then(r=>r.json());
 try{
  $("err").textContent="جارٍ تسجيل الدخول…";
  const a=await J("");
  if(!a.user_info||String(a.user_info.auth)!=="1"){$("err").textContent="بيانات الدخول غير صحيحة أو الحساب منتهٍ";return}
  const [lc,ls,vc,vs,sc,ss]=await Promise.all(["get_live_categories","get_live_streams","get_vod_categories","get_vod_streams","get_series_categories","get_series"].map(x=>J(x).catch(()=>[])));
  const m=arr=>Object.fromEntries((Array.isArray(arr)?arr:[]).map(c=>[c.category_id,c.category_name]));
  const L=m(lc),V=m(vc),S=m(sc),out=[];
  (Array.isArray(ls)?ls:[]).forEach(x=>out.push({name:x.name,logo:x.stream_icon,group:L[x.category_id]||"مباشر",k:"live",url:`${s}/live/${u}/${p}/${x.stream_id}.m3u8`}));
  (Array.isArray(vs)?vs:[]).forEach(x=>out.push({name:x.name,logo:x.stream_icon,group:V[x.category_id]||"أفلام",k:"movies",url:`${s}/movie/${u}/${p}/${x.stream_id}.${x.container_extension||"mp4"}`}));
  (Array.isArray(ss)?ss:[]).forEach(x=>out.push({name:x.name,logo:x.cover,group:S[x.category_id]||"مسلسلات",k:"series",sid:x.series_id,url:""}));
  if(!out.length){$("err").textContent="الحساب لا يحتوي على محتوى";return}
  XT={s,u,p};items=out;
  if(save){try{localStorage.setItem(KX,JSON.stringify(c))}catch(e){}}
  $("err").textContent="";enter();
 }catch(e){$("err").textContent="تعذّر الاتصال بالسيرفر. تأكد من العنوان، وأن الصفحة وhttp/https متوافقان."}
}
async function episodes(it){
 $("ep").classList.remove("hide");$("eh").textContent=it.name;$("el").textContent="جارٍ التحميل…";
 try{
  const r=await fetch(`${XT.s}/player_api.php?username=${encodeURIComponent(XT.u)}&password=${encodeURIComponent(XT.p)}&action=get_series_info&series_id=${it.sid}`).then(r=>r.json());
  $("el").innerHTML="";
  Object.keys(r.episodes||{}).sort((a,b)=>a-b).forEach(se=>{
   const h=document.createElement("h3");h.textContent="الموسم "+se;h.style.margin="14px 0 8px";$("el").appendChild(h);
   r.episodes[se].forEach(e=>{
    const d=document.createElement("div");d.className="e";d.tabIndex=0;d.onkeydown=e=>{if(e.key==="Enter")d.click()};d.textContent=(e.episode_num?e.episode_num+". ":"")+(e.title||"حلقة");
    d.onclick=()=>{$("ep").classList.add("hide");play({name:it.name+" - "+(e.title||""),url:`${XT.s}/series/${XT.u}/${XT.p}/${e.id}.${e.container_extension||"mp4"}`})};
    $("el").appendChild(d);
   });
  });
  if(!$("el").children.length)$("el").textContent="لا توجد حلقات";
 }catch(e){$("el").textContent="تعذّر تحميل الحلقات"}
}
$("epc").onclick=()=>$("ep").classList.add("hide");
$("goX").onclick=()=>{
 let sv=$("xs").value.trim();const u=$("xu").value.trim(),p=$("xp").value.trim();
 if(!sv||!u||!p){$("err").textContent="أدخل السيرفر واسم المستخدم وكلمة المرور";return}
 if(!/^https?:\/\//i.test(sv))sv="http://"+sv;
 xtLogin({s:sv,u,p},true);
};
try{const x=localStorage.getItem(KX);if(x)xtLogin(JSON.parse(x),false)}catch(e){}
</script>
</body>
</html>
